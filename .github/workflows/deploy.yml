name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never abort a half-finished deploy: a newer push waits for the run in flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the deploy on the same checks CI runs. `biome ci` skips
      # `public/drawio/` (git-ignored), so it belongs before the asset fetch.
      - name: Check source
        run: pnpm check:ci

      - name: Run unit tests
        run: pnpm test

      # `public/drawio/` is git-ignored; without this the deploy would ship a
      # broken draw.io editor.
      - name: Fetch draw.io assets
        run: pnpm drawio:assets

      - name: Build application
        run: pnpm build

      # Apply pending D1 migrations before the new Worker goes live: the
      # command is idempotent (it skips files already recorded in
      # d1_migrations), so runs with no new migration are a no-op. Failures
      # abort the deploy, leaving the old Worker serving the old schema.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply inkwell --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
